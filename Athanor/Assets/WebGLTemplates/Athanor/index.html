<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" href="data:,">
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; background: #000; image-rendering: pixelated; outline: none; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 240px; font: 12px monospace; color: #a88a6a; text-align: center; letter-spacing: 2px; }
      #bar { margin-top: 10px; height: 8px; border: 2px solid #6a4428; background: #1a0e14; }
      #fill { height: 100%; width: 0; background: #f08a2c; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">ATHANOR<div id="bar"><div id="fill"></div></div></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      // The game draws a 640x360 picture at the largest whole multiple that fits and centres it on black.
      // For that to stay sharp the canvas must have exactly one pixel per screen pixel, so its size is set here
      // rather than left to the browser. A window too small for 640x360 gets the whole picture, shrunk to fit.
      var canvas = document.querySelector("#unity-canvas"), W = 640, H = 360;
      function fit() {
        var dpr = window.devicePixelRatio || 1, w = Math.round(window.innerWidth * dpr), h = Math.round(window.innerHeight * dpr);
        var s = Math.min(w / W, h / H);
        if (s >= 1) {
          canvas.width = w; canvas.height = h;
          canvas.style.left = "0"; canvas.style.top = "0"; canvas.style.width = "100vw"; canvas.style.height = "100vh";
        } else {
          canvas.width = W; canvas.height = H;
          var cw = W * s / dpr, ch = H * s / dpr;
          canvas.style.width = cw + "px"; canvas.style.height = ch + "px";
          canvas.style.left = (window.innerWidth - cw) / 2 + "px"; canvas.style.top = (window.innerHeight - ch) / 2 + "px";
        }
      }
      fit();
      window.addEventListener("resize", fit);

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        matchWebGLToCanvasSize: false,
        autoSyncPersistentDataPath: true,
      }, function (progress) {
        document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        document.querySelector("#loading").remove();
        fit();
        canvas.focus();
      }).catch(function (message) {
        document.querySelector("#loading").textContent = "Could not start: " + message;
      });
    </script>
  </body>
</html>
