<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athanor Depth Mockup</title>
<style>
  :root { --bg: #0d0a12; --panel: #17121c; --line: #3a2c3c; --text: #e8dcc8; --dim: #9a8a7a; --gold: #f0c050; --accent: #7cc0f8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 12px/1.35 system-ui, -apple-system, Segoe UI, sans-serif; }
  #app { display: flex; gap: 12px; padding: 16px; align-items: flex-start; }
  #stageWrap { flex: 1 1 auto; min-width: 0; }
  #stage { position: relative; margin: 0 auto; background: #000; }
  #stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  #hud { pointer-events: none; }
  #caption { margin: 10px auto 0; color: var(--dim); max-width: 1280px; }
  #caption b { color: var(--text); }
  #panel { flex: 0 0 264px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; max-height: calc(100vh - 32px); overflow: auto; }
  #panel h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); margin: 14px 0 6px; }
  #panel h2:first-child { margin-top: 0; }
  .variants { display: flex; gap: 6px; }
  .variants button, .btn { flex: 1; background: #241b26; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 6px 4px; cursor: pointer; font: inherit; }
  .variants button.on { background: #3b2a1a; border-color: var(--gold); color: var(--gold); }
  .row { display: grid; grid-template-columns: 16px 1fr 70px 34px; align-items: center; gap: 4px; margin: 2px 0; }
  .row.g { grid-template-columns: 1fr 96px 38px; }
  .row.c { grid-template-columns: 1fr; }
  .row label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row input[type=range] { width: 100%; accent-color: var(--gold); }
  .row output { color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; font-size: 11px; }
  .note { color: var(--dim); font-size: 12px; margin: 4px 0; }
  select { background: #241b26; color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; }
  @media (max-width: 900px) { #app { flex-direction: column; padding: 16px; } #panel { flex: none; width: 100%; max-height: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <div id="stage"><canvas id="view" width="640" height="360"></canvas><canvas id="hud" width="640" height="360"></canvas></div>
    <div id="caption"></div>
  </div>
  <div id="panel"></div>
</div>
<script src="assets.js"></script>
<script src="main.js"></script>
</body>
</html>
