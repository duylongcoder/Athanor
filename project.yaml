# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.3.0
  last_upgraded: 2026-11-14

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/project-settings --local <key>=<value>` writes there; `/project-settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

project:
  name: "Athanor"
  genre: "Run-based alchemy puzzle"
  version: "0.4.0"
  stage: Production
  kind: game
  goal: hobby

modes:
  review_mode: lean
  workflow: standard
  automation: collaborative
  story_granularity: balanced

docs:
  density: balanced

testing:
  framework: "NUnit (Unity Test Framework + dotnet test tools/CoreTests)"
  strict:
    logic: true
    integration: true
    visual: false
    ui: false
    config: false

qa:
  level: standard

team:
  size: individual

platform:
  multiplayer: false
  online: false
  targets: [Web]
  primary_input: "Mouse"
  gamepad_support: "None"
  touch_support: "Partial"
  cert_tier: none

engine:
  name: "Unity"
  version: "6000.6.7f1"
  language: "C#"
  rendering: "Universal 2D (URP), 2D lights, bloom, Pixel Perfect Camera"
  physics: "none"
  code_root: "Athanor/Assets/Scripts"
  test_root: "Athanor/Assets/Tests"

specialists:
  code: "unity-specialist"
  shader: "unity-shader-specialist"
  ui: "unity-ui-specialist"

naming:
  classes: PascalCase
  variables: camelCase
  constants: PascalCase
  signals: past_tense
  files: PascalCase
  scenes: PascalCase

accessibility:
  target: none

cadence:
  sprint_length: "1w"
  milestone_length: "4w"

performance:
  target_framerate: 60
  frame_budget_ms: 16.67
  enforce: warn

commands:
  build: "unity build Athanor --target WebGL --execute-method WebBuild.Build --allow-dirty-build"
  test: "unity test Athanor --mode EditMode"
  run: "unity open Athanor"
  smoke: "node tools/web/webtest.mjs http://127.0.0.1:8080/ /tmp/athanor-web"

features:
  session_state: on
  token_budget_warn_at: 0.7
  read_guard: on
  read_guard_kb: 40

updates:
  check: false
